name: Automatic Job Discovery

# Producer workflow: claim due companies → ATS adapters → gpt-fit-v2 → submit
# discovery batches, then hand off to the existing inbox processor in the same run.
#
# Scheduled runs require repository variable:
#   AUTO_DISCOVERY_SCHEDULE_ENABLED=true
# Manual workflow_dispatch always runs.
on:
  workflow_dispatch:
    inputs:
      max_companies:
        description: "Max companies to claim this run (blank = repository variable)"
        required: false
        default: ""
      top_candidates:
        description: "Top candidates per company, 1-5 (blank = repository variable)"
        required: false
        default: ""
      max_evals:
        description: "Max new LLM evaluations this run (blank = repository variable)"
        required: false
        default: ""
      skip_expansion:
        description: "Set true to skip company expansion / verification"
        required: false
        default: "false"
      skip_inbox_handoff:
        description: "Set true to skip process_discovery_inbox after producer"
        required: false
        default: "false"
  schedule:
    # Overnight burst so results are ready by ~4:00 AM Pacific. GitHub cron is UTC
    # and scheduled starts are often delayed hours, so runs start well before then:
    # 04:17/06:17/08:17/10:17 UTC = 9:17 PM/11:17 PM/1:17 AM/3:17 AM PDT (one hour
    # earlier in PST). Off-the-hour minutes reduce top-of-hour queue delays.
    - cron: "17 4,6,8,10 * * *"

permissions:
  contents: read

concurrency:
  group: automatic-job-discovery
  cancel-in-progress: false

jobs:
  automatic-discovery:
    if: >
      github.event_name == 'workflow_dispatch' ||
      vars.AUTO_DISCOVERY_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_PERSISTENCE_MODE: remote
      JOB_MCP_URL: https://jay-job-mcp.vercel.app/api/mcp
      AUTH0_TOKEN_URL: https://jay-job.us.auth0.com/oauth/token
      AUTH0_AUDIENCE: https://jay-job-mcp-michaeltchueng-2909s-projects.vercel.app/api/mcp
      AUTH0_SCOPES: jobs:read jobs:write jobs:worker
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
      AUTO_DISCOVERY_WORKER_IDENTITY: github-actions
      # New per-run limit names win; legacy repository variables remain honored.
      AUTO_DISCOVERY_MAX_COMPANIES_PER_RUN: ${{ github.event.inputs.max_companies || vars.AUTO_DISCOVERY_MAX_COMPANIES_PER_RUN || vars.AUTO_DISCOVERY_MAX_COMPANIES || '5' }}
      AUTO_DISCOVERY_MAX_LISTINGS_PER_COMPANY: ${{ vars.AUTO_DISCOVERY_MAX_LISTINGS_PER_COMPANY || vars.AUTO_DISCOVERY_MAX_CANDIDATES_PER_COMPANY || '100' }}
      AUTO_DISCOVERY_TOP_CANDIDATES_PER_COMPANY: ${{ github.event.inputs.top_candidates || vars.AUTO_DISCOVERY_TOP_CANDIDATES_PER_COMPANY || '5' }}
      AUTO_DISCOVERY_MAX_EVALS_PER_RUN: ${{ github.event.inputs.max_evals || vars.AUTO_DISCOVERY_MAX_EVALS_PER_RUN || '15' }}
      AUTO_DISCOVERY_MAX_BATCHES_PER_RUN: ${{ vars.AUTO_DISCOVERY_MAX_BATCHES_PER_RUN || '3' }}
      AUTO_DISCOVERY_MAX_JOBS_PER_BATCH: ${{ vars.AUTO_DISCOVERY_MAX_JOBS_PER_BATCH || '5' }}
      AUTO_DISCOVERY_MIN_RANK_SCORE: ${{ vars.AUTO_DISCOVERY_MIN_RANK_SCORE || '20' }}
      AUTO_DISCOVERY_MAX_VERIFICATIONS_PER_RUN: ${{ vars.AUTO_DISCOVERY_MAX_VERIFICATIONS_PER_RUN || '5' }}
      DISCOVERY_INBOX_WORKER_IDENTITY: github-actions
      DISCOVERY_INBOX_BATCH_LIMIT: ${{ vars.DISCOVERY_INBOX_BATCH_LIMIT || '5' }}
      DISCOVERY_INBOX_STALE_PROCESSING_MINUTES: ${{ vars.DISCOVERY_INBOX_STALE_PROCESSING_MINUTES || '60' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets are present
        env:
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${AUTH0_CLIENT_ID}" ]; then echo "AUTH0_CLIENT_ID is not configured"; missing=1; fi
          if [ -z "${AUTH0_CLIENT_SECRET}" ]; then echo "AUTH0_CLIENT_SECRET is not configured"; missing=1; fi
          llm_ok=0
          if [ -n "${GEMINI_API_KEY}" ]; then llm_ok=1; fi
          if [ -n "${GROQ_API_KEY}" ]; then llm_ok=1; fi
          if [ -n "${OPENAI_API_KEY}" ]; then llm_ok=1; fi
          if [ "$llm_ok" -eq 0 ]; then
            echo "At least one of GEMINI_API_KEY / GROQ_API_KEY / OPENAI_API_KEY must be configured"
            missing=1
          fi
          # Never print secret values.
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Required Auth0 M2M and LLM secrets are present (values not logged)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Expand and verify discovery companies
        # Seed catalog + history-derived official ATS URLs only; bounded verification.
        # Expansion problems never block the producer or inbox processing.
        if: ${{ github.event.inputs.skip_expansion != 'true' && vars.AUTO_DISCOVERY_EXPANSION_ENABLED != 'false' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m job_agent.examples.expand_discovery_companies \
            --max-verifications "${AUTO_DISCOVERY_MAX_VERIFICATIONS_PER_RUN}"

      - name: Run automatic discovery producer
        run: |
          set -euo pipefail
          MAX="${AUTO_DISCOVERY_MAX_COMPANIES_PER_RUN}"
          echo "Claiming up to ${MAX} due discovery company(ies)"
          # Secrets and Neon connection strings are never echoed.
          python -m job_agent.examples.automatic_discovery_run \
            --max-companies "${MAX}" \
            --skip-inbox-handoff

      - name: Process pending discovery inbox batches
        if: ${{ github.event.inputs.skip_inbox_handoff != 'true' }}
        run: |
          set -euo pipefail
          LIMIT="${DISCOVERY_INBOX_BATCH_LIMIT}"
          echo "Processing up to ${LIMIT} pending discovery inbox batch(es)"
          python -m job_agent.examples.process_discovery_inbox \
            --limit "${LIMIT}" \
            --recover-stale \
            --fail-on-batch-failure

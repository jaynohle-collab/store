name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/secure-remote-mcp

permissions:
  contents: read

jobs:
  remote-mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote_mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remote_mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s job_agent/tests -v

name: Daily Job Discovery

# Manual production testing: Actions → Daily Job Discovery → Run workflow
# Scheduled run: ~8:00 AM Pacific. GitHub cron is UTC; DST shifts the local hour.
#   Pacific Daylight Time (UTC-7): 15:00 UTC ≈ 8:00 AM PDT
#   Pacific Standard Time (UTC-8): 15:00 UTC ≈ 7:00 AM PST
on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: read

concurrency:
  group: daily-job-discovery
  cancel-in-progress: false

jobs:
  discover-and-persist:
    # Manual workflow_dispatch always runs.
    # Scheduled runs require repository variable JOB_DISCOVERY_SCHEDULE_ENABLED=true.
    if: >
      github.event_name == 'workflow_dispatch' ||
      vars.JOB_DISCOVERY_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
      DISCOVERY_MAX_JOBS: ${{ vars.DISCOVERY_MAX_JOBS || '100' }}
      DISCOVERY_TIME_ZONE: ${{ vars.DISCOVERY_TIME_ZONE || 'America/Los_Angeles' }}
      JOB_PERSISTENCE_MODE: remote
      # Stable public MCP URL for transport.
      JOB_MCP_URL: https://jay-job-mcp.vercel.app/api/mcp
      AUTH0_TOKEN_URL: https://jay-job.us.auth0.com/oauth/token
      # Preserve the existing configured Auth0 API audience (do not swap to the
      # public stable hostname just because JOB_MCP_URL uses it).
      AUTH0_AUDIENCE: https://jay-job-mcp-michaeltchueng-2909s-projects.vercel.app/api/mcp
      AUTH0_SCOPES: jobs:read jobs:write jobs:delete
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated daily discovery
        run: python -m job_agent.examples.automated_daily_run

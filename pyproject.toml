[project]
name = "job-memory-mcp"
version = "0.1.0"
description = "Personal job search memory MCP server using SQLite, SQLAlchemy, FastMCP, and Pydantic."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]

[project.dependencies]
fastmcp = "*"
mcp = ">=2.0,<3"
sqlalchemy = "^2.0"
pydantic = "^2.0"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"